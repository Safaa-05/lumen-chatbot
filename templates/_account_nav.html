<nav class="acct" aria-label="Account">
  {% if username %}
    <a href="{{ url_for('dashboard') }}">Mood history</a>
    <span class="who">{{ username }}</span>
    <form method="post" action="{{ url_for('logout') }}" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <button type="submit" class="linkish">Log out</button>
    </form>
  {% else %}
    <a href="{{ url_for('login') }}">Log in</a>
    <a class="btn-quiet" href="{{ url_for('register') }}">Sign up</a>
  {% endif %}
</nav>
